<!DOCTYPE html>

          <defs>
            <linearGradient id="app-logo-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b5cf6" />
              <stop offset="1" stop-color="#a78bfa" />
