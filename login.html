<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — BID</title>
  <meta name="description" content="Inicia sesión en BID para continuar con tus ideas de negocio." />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='8' width='16' height='16' rx='4' transform='rotate(45 16 16)' fill='%237c3aed'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <header class="login-header">
    <a href="index.html" class="logo logo-lg" aria-label="BID — volver al inicio">
      <svg class="logo-icon" width="44" height="44" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="login-logo-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stopColor="#7c3aed" />
            <stop offset="1" stopColor="#8b5cf6" />
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="16" height="16" rx="4" transform="rotate(45 16 16)" fill="url(#login-logo-gradient)" />
      </svg>
      <span class="logo-text">BID</span>
    </a>
  </header>

  <main class="login-main">
    <div class="card login-card">
      <h1 class="login-title">Bienvenido de vuelta</h1>
      <p class="login-subtitle">Inicia sesión para continuar con tus ideas de negocio.</p>

      <div id="login-body">
        <form id="login-form" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="email">Correo electrónico</label>
            <input class="auth-input" type="email" id="email" name="email" required placeholder="tu@correo.com" autocomplete="email" />
          </div>
          <div class="auth-field">
            <label class="auth-label" for="password">Contraseña</label>
            <input class="auth-input" type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-block auth-submit">Iniciar sesión</button>
        </form>
        <p class="login-switch">
          ¿No tienes cuenta? <a href="#" data-fake>Regístrate gratis</a>
        </p>
        <div class="auth-divider"><span>o</span></div>
        <button type="button" id="demo-btn" class="btn btn-ghost btn-block">Entrar como demo</button>
      </div>

      <div id="login-success" class="success-state hidden">
        <svg class="success-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--success)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="m8.5 12.5 2.5 2.5 4.5-5" />
        </svg>
        <h3 class="success-title">¡Sesión iniciada!</h3>
        <p class="success-text" id="success-message">Bienvenido de vuelta a BID. Esta es una simulación de acceso.</p>
        <a href="index.html" class="btn btn-ghost">Volver al inicio</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <span class="footer-copy">BID © 2026</span>
      <div class="footer-links">
        <a href="#" data-fake class="footer-link">Privacidad</a>
        <span class="footer-sep">|</span>
        <a href="#" data-fake class="footer-link">Términos</a>
        <span class="footer-sep">|</span>
        <a href="#" data-fake class="footer-link">Contacto</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
